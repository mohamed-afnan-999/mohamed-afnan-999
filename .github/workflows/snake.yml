name: Generate GitHub Contribution Snake

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *" 
  workflow_dispatch: # Allows you to run it manually
  push:
    branches:
      - main # Change this to 'master' if your default branch is master

jobs:
  generate:
    permissions: 
      contents: write # Crucial: Allows the action to push the generated images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # GitHub provides this token automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push SVGs to the 'output' branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
